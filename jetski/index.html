<!DOCTYPE html>
<html lang="en">

  <head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400&family=Inter+Tight:wght@300;400;500&display=swap"/>
  <!-- Fonts used by the loading screen cycling animation -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital@1&family=Space+Mono&family=Oswald:wght@300&family=Merriweather:ital@1&family=Josefin+Sans:wght@300&family=Raleway:wght@300&family=Lora:ital@1&family=Inconsolata&family=Orbitron&family=Press+Start+2P&family=Special+Elite&family=Abril+Fatface&family=Courier+Prime:ital@1&family=Righteous&family=Permanent+Marker&family=Caveat&family=Pacifico&family=VT323&family=Syne:wght@300&display=swap">
    <!-- Initial background gradient and accent hover color styles applied before render to prevent color flashes -->
    <style>
      :root { --hover-color: #91bfff; }
      #bg { background: linear-gradient(to bottom, #414d4f, #394034) !important; }
      body { background: transparent !important; }
    </style>

    <!--Google fonts-->
    <meta charset="UTF-8" />

    <!--Logo-->
    <link id="logo" rel="icon" type="image"/>

    <!--Import Map-->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
        }
      }
    </script>

    <!--Styles-->
    <link rel="stylesheet" href="style.css" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--Title-->
    <title id="title"></title>

  </head>

  <body id="body">

    <canvas id="bg"></canvas>

    <!--Main script-->
    <script id="main" type="module" src="main.js"></script>

    <!--Loading div-->
    <div id="loading">
      <p class="loading-text">Loading<span class="loading-dot">.</span><span class="loading-dot">.</span><span class="loading-dot">.</span></p>
    </div>

    <!--Main navigation links and mobile nav links-->
    <div id="home" style="visibility: hidden" class="logolink">
      <div id="logolink" class="logo-tint-mask" style="width: 100%; height: 100%;"></div>
    </div>
    <div id="mainnavlinks" style="position: absolute; top: 0; right: 0; width: 100%; z-index: 10; pointer-events: none; visibility: hidden;"></div>
    <div id="linkedin-desktop-wrapper" style="position: absolute; bottom: 0; right: 0; z-index: 10; pointer-events: none; visibility: hidden; margin-bottom: clamp(16px, 1.8vw, 42px); margin-right: clamp(16px, 1.8vw, 42px);">
      <a id="linkedin-desktop" href="https://www.linkedin.com/in/noah-gunther-3128bb185/" target="_blank" style="pointer-events: auto; display: block; width: clamp(32px, 2.1vw, 42px); height: clamp(32px, 2.1vw, 42px); border: none; padding: 0; text-decoration: none;">
        <div id="linkedin-desktop-icon" class="logo-tint-mask" style="-webkit-mask-image: url('graphics/li_logo_white.webp'); mask-image: url('graphics/li_logo_white.webp'); width: 100%; height: 100%;"></div>
      </a>
    </div>
    <div id="mobilenavlinksbutton" style="visibility: hidden;">
      <div id="mobilenavlinksbuttontop"></div>
      <div id="mobilenavlinksbuttonmiddle"></div>
      <div id="mobilenavlinksbuttonbottom"></div>
    </div>
    <div id="mobilenavmenu" style="visibility: hidden;">
      <div id="mobilenavlinks"></div>
      <div id="mobilenavbackgroundblur"></div>
    </div>
    <div id="plaintext-link" aria-hidden="true">plain text</div>

    <!--About me panel-->
    <div id="aboutmepanel" style="visibility: hidden;">
      <div id="aboutmepanelwrapper" style="padding: min(8vw, 40px); box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
        <h2 style="font-family: 'IBM Plex Mono', monospace; font-size: clamp(20px, 2.5vw, 28px); margin: 0 0 12px 0; color: #ffae21;">About Noah Gunther</h2>
        <div style="margin: 28px 0 36px; display: flex; justify-content: center; width: 100%;">
          <img src="./graphics/portrait.webp" alt="Noah Gunther Self Portrait" style="width: clamp(95px, 11.25vw, 138px); height: auto; border-radius: 6px;" />
        </div>
        <p style="font-family: 'IBM Plex Sans', sans-serif; font-size: clamp(14px, 1.5vw, 17px); line-height: 1.6; color: #333333; margin: 0; font-weight: 400;">
          Technical Artist and Creative Coder specializing in real-time computer graphics, interactive web design, and AR/VR development. I build tools, pipelines, and premium digital experiences from prototype to production.
        </p>
      </div>
    </div>

    <!--Phone screen panel-->
    <div id="phonescreen" style="visibility: hidden;">


      <div id="mobilearprojectsheader">
        <div id="mobilearprojectsheaderclock"></div>
        <div id="mobilearprojectsheaderwidgets">
        </div>
        <div id="mobilearprojectsheadertext">
          Mobile AR Projects
        </div>
      </div>

      <div id="mobilearscrollwrapper"></div>

      <div id="mobileartray" style="visibility: hidden;">
        <div class="mobileartraybuttons" style="left: 18%">
          <div id="mobileartraybuttonlast">
            <img>
          </div>
        </div>
        <div class="mobileartraybuttons">
          <div id="mobileartraybuttonhome">
            <img>
          </div>
        </div>
        <div class="mobileartraybuttons" style="left: 82%;">
          <div id="mobileartraybuttonnext">
            <img>
          </div>
        </div>
      </div>

      <div id="mobilearinfobuttonwrapper" style="visibility: hidden;">
        <div id="mobilearinfobutton" style="width: 100%; height: 100%;">
          <img>
        </div>
      </div>


    </div>

    <!--AR info panel-->
    <div id="arinfopanelbackgroundblur" style="visibility: hidden;"></div>
    <div id="arinfopanel" style="visibility: hidden;">
      <div id="arinfopanelwrapper">
        <div class="arinfopanelicon">
          <div id="arinfopanelicon">

          </div>
        </div>
        <div id="arinfopaneltextwrapper" class="arinfopaneltextwrapper">
          <div id="arinfopanelsubject"></div>
          <div id="arinfopaneltitle"></div>
          <div id="arinfopanelsubtitle"></div>
          <div id="arinfopanelcontent"></div>
        </div>
        <div id="arinfopanelclosebuttonwrapper">
          <div id="arinfopanelclosebuttonback">
            <img id="arinfopanelclosebuttonbackborder">
            <div id="arinfopanelclosebutton">
              <img>
            </div>
          </div>
        </div>
        <div id="arinfopanelmobilebuttonswrapper" style="visibility: hidden;">
          <div id="arinfopanelmobilebuttonsback">
            <img>
            <div id="arinfopanelmobilelastanim" style="position: absolute; height: 100%; width: 100%; top: 0; left: -30%;">
              <div id="arinfopanelmobilelastbutton" class="arinfopanelmobilebuttons">
                <img>
              </div>
            </div>
            <div id="arinfopanelmobilecloseanim" style="position: absolute; height: 100%; width: 100%; top: 0;">
              <div id="arinfopanelmobileclosebutton" class="arinfopanelmobilebuttons">
                <img>
              </div>
            </div>
            <div id="arinfopanelmobilenextanim" style="position: absolute; height: 100%; width: 100%; top: 0; left: 30%;">
              <div id="arinfopanelmobilenextbutton" class="arinfopanelmobilebuttons">
                <img>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!--Down arrow-->
    <div id="downarrow" style="visibility: hidden;">
      <div id="downarrowback" class="downarrowwrapper">
        <img>
      </div>
      <div id="downarrowfront" class="downarrowwrapper">
        <img>
      </div>
    </div>

    <!--Left arrow-->
    <div id="leftarrow" style="visibility: hidden;">
      <div id="leftarrowback" class="leftarrowwrapper" style="bottom: 10%;">
        <img>
      </div>
      <div id="leftarrowfront" class="leftarrowwrapper" style="bottom: 11.15%;">
        <img>
      </div>
    </div>

    <!--Plain text site toggle-->
    <a id="sitemodetoggle" href=""></div>

  </body>

</html>
